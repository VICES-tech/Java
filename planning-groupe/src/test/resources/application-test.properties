# Réglages des tests automatiques (profil « test »).
#
# Par défaut, les tests utilisent une base H2 en mémoire, en mode PostgreSQL.
# Pour les lancer sur un vrai PostgreSQL, il suffit de définir ces variables :
#   PLANIT_TEST_DB_URL=jdbc:postgresql://localhost:5432/planit_test
#   PLANIT_TEST_DB_USER=...   PLANIT_TEST_DB_PASSWORD=...
spring.datasource.url=${PLANIT_TEST_DB_URL:jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${PLANIT_TEST_DB_USER:sa}
spring.datasource.password=${PLANIT_TEST_DB_PASSWORD:}

planning.dossier-fichiers=target/test-fichiers
