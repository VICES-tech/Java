# =====================================================================
# Réglages de production : activés avec SPRING_PROFILES_ACTIVE=prod
#
# Les adresses et mots de passe ne sont jamais écrits dans le code :
# ils viennent de variables d'environnement définies sur le serveur.
# S'il en manque une, l'application refuse de démarrer.
# =====================================================================

# Base PostgreSQL, ex. PLANIT_DB_URL=jdbc:postgresql://localhost:5432/planit
spring.datasource.url=${PLANIT_DB_URL}
spring.datasource.username=${PLANIT_DB_USER}
spring.datasource.password=${PLANIT_DB_PASSWORD}

# Code demandé pour créer le tout premier compte (l'administrateur)
planit.code-installation=${PLANIT_CODE_INSTALLATION}
