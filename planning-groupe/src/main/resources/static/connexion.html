<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>PlanIt — Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-connexion">
<main class="carte-connexion">
    <h1>🎵 PlanIt</h1>

    <!-- Connexion habituelle -->
    <form id="form-connexion">
        <p class="info">Connecte-toi pour voir le planning du groupe.</p>
        <label>E-mail
            <input name="email" type="email" required autocomplete="username" autofocus>
        </label>
        <label>Mot de passe
            <input name="motDePasse" type="password" required autocomplete="current-password">
        </label>
        <p id="erreur-connexion" class="erreur" role="alert"></p>
        <button class="principal">Se connecter</button>
        <p class="info">Pas encore de compte, ou mot de passe oublié ? Demande à un administrateur du groupe.</p>
    </form>

    <!-- Tout premier lancement : création du compte administrateur -->
    <form id="form-premier" hidden>
        <p class="info">Bienvenue ! Crée le premier compte : ce sera l'administrateur du groupe.</p>
        <label>Ton nom
            <input name="nom" required maxlength="60" autocomplete="name">
        </label>
        <label>E-mail
            <input name="email" type="email" required autocomplete="username">
        </label>
        <label>Mot de passe (8 caractères minimum)
            <input name="motDePasse" type="password" required minlength="8" maxlength="64" autocomplete="new-password">
        </label>
        <label id="champ-code" hidden>Code d'installation
            <input name="code" autocomplete="off">
        </label>
        <p id="erreur-premier" class="erreur" role="alert"></p>
        <button class="principal">Créer mon compte</button>
    </form>
</main>

<script src="connexion.js"></script>
</body>
</html>
