spring.application.name=planning-groupe

# Écoute sur toutes les interfaces : les téléphones du même réseau Wi-Fi
# peuvent se connecter via http://<adresse-IP-du-PC>:8080
server.port=8080

# Base de données H2 stockée dans un fichier (les données survivent au redémarrage)
spring.datasource.url=jdbc:h2:file:./data/planning;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Renvoie le message d'erreur (ex. « Ce nom est déjà pris ») à l'interface
server.error.include-message=always
