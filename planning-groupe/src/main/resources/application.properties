spring.application.name=planning-groupe

# Écoute sur toutes les interfaces : les téléphones du même réseau Wi-Fi
# peuvent se connecter via http://<adresse-IP-du-PC>:8080
server.port=8080

# Base de données
# - En développement : H2, une base rangée dans un simple fichier (data/), rien à installer.
#   Le mode PostgreSQL de H2 la fait se comporter comme la base de production.
# - En production : PostgreSQL, voir application-prod.properties.
spring.datasource.url=jdbc:h2:file:./data/planning;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Les tables sont créées et modifiées uniquement par les scripts Flyway
# (src/main/resources/db/migration). Hibernate vérifie seulement au démarrage
# qu'elles correspondent aux classes Java, et refuse de démarrer sinon.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Renvoie le message d'erreur (ex. « Ce nom est déjà pris ») à l'interface
spring.web.error.include-message=always

# Pièces jointes des chants (audio, vidéo, PDF…).
# 500 Mo par fichier : de quoi déposer une vidéo de répétition de quelques minutes filmée au téléphone.
planning.dossier-fichiers=./data/fichiers
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Connexion : on reste connecté 30 jours sur son téléphone
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Code demandé pour créer le tout premier compte (l'administrateur).
# Vide = pas de code : à remplir avant de mettre l'application en ligne.
planit.code-installation=
